<body>

    <script>
    (function() {
        const STORAGE_USERS = 'garden_users_v2';
        const STORAGE_CURRENT_USER = 'garden_current_user';
        const TEACHER_NAME = '筠';
        const TEACHER_INVITE_CODE = 'YUN2026';

        let essays = [];
        let currentUser = null;
        let currentEditId = null;
        let cloudApp = null;
        let cloudDb = null;
        let cloudReady = false;

        // ---------- 初始化腾讯云开发 ----------
        async function initCloud() {
            try {
                cloudApp = cloudbase.init({ env: ENV_ID });
                const auth = cloudApp.auth({ persistence: 'local' });
                if (!auth.hasLoginState()) {
                    await auth.anonymousAuthProvider().signIn();
                }
                cloudDb = cloudApp.rdb();
                cloudReady = true;
                console.log('✅ 腾讯云开发初始化成功');
            } catch (err) {
                console.error('❌ 腾讯云开发初始化失败', err);
                cloudReady = false;
            }
        }

        // ---------- 用户管理（本地） ----------
        function loadUsers() {
            const stored = localStorage.getItem(STORAGE_USERS);
            if (stored) {
                try { return JSON.parse(stored); } catch (e) {}
            }
            return [];
        }

        function saveUsers(users) {
            localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
        }

        function findUser(users, name) {
            return users.find(u => u.name === name);
        }

        function registerStudent(users, name, password) {
            if (findUser(users, name)) return false;
            users.push({ name: name, role: 'student', password: password });
            saveUsers(users);
            return true;
        }

        function registerTeacher(users, password, inviteCode) {
            if (inviteCode !== TEACHER_INVITE_CODE) {
                return { success: false, msg: '邀请码错误' };
            }
            if (password.length < 6) {
                return { success: false, msg: '密码至少6位' };
            }
            users.push({ name: TEACHER_NAME, role: 'teacher', password: password });
            saveUsers(users);
            return { success: true, msg: '老师账号注册成功！' };
        }

        function changePassword(users, name, oldPwd, newPwd) {
            const user = findUser(users, name);
            if (!user) return { success: false, msg: '用户不存在' };
            if (user.password !== oldPwd) return { success: false, msg: '当前密码错误' };
            if (newPwd.length < 6) return { success: false, msg: '新密码至少6位' };
            user.password = newPwd;
            saveUsers(users);
            return { success: true, msg: '密码修改成功！' };
        }

        function loginUser(name, password) {
            const users = loadUsers();
            const user = findUser(users, name);

            if (name === TEACHER_NAME && !user) {
                return { needInvite: true };
            }

            if (!user) {
                if (name === TEACHER_NAME) {
                    return { success: false, msg: '老师账号尚未注册' };
                }
                if (password.length < 6) {
                    return { success: false, msg: '密码至少6位，请重新输入' };
                }
                registerStudent(users, name, password);
                currentUser = { name: name, role: 'student' };
                localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify(currentUser));
                updateUI();
                return { success: true, msg: '注册成功！欢迎 ' + name };
            }

            if (user.password !== password) {
                return { success: false, msg: '密码错误' };
            }

            currentUser = { name: user.name, role: user.role };
            localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify(currentUser));
            updateUI();
            return { success: true, msg: '登录成功！' };
        }

        function completeTeacherRegister(password, inviteCode) {
            const users = loadUsers();
            const result = registerTeacher(users, password, inviteCode);
            if (result.success) {
                currentUser = { name: TEACHER_NAME, role: 'teacher' };
                localStorage.setItem(STORAGE_CURRENT_USER, JSON.stringify(currentUser));
                updateUI();
            }
            return result;
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem(STORAGE_CURRENT_USER);
            updateUI();
        }

        // ---------- 云端数据操作 ----------
        async function loadData() {
            const container = document.getElementById('essayListContainer');
            container.innerHTML = '<div class="empty-msg">📜 正在加载作文，请稍候……</div>';

            if (!cloudReady) {
                container.innerHTML = '<div class="empty-msg">⚠️ 云开发未初始化，请刷新页面重试</div>';
                return;
            }

            try {
                const { data, error } = await cloudDb
                    .from('essays')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                essays = (data || []).map(item => ({
                    id: item.id.toString(),
                    title: item.title,
                    author: item.author,
                    category: item.category,
                    owner: item.owner,
                    currentVersion: item.current_version,
                    versions: typeof item.versions === 'string' ? JSON.parse(item.versions) : (item.versions || [])
                }));

                renderList();
            } catch (err) {
                console.error('加载失败', err);
                container.innerHTML = '<div class="empty-msg">⚠️ 加载失败：' + (err.message || '请检查网络') + '</div>';
            }
        }

        async function insertEssay(essayData) {
            const { data, error } = await cloudDb.from('essays').insert([essayData]).select();
            if (error) throw error;
            return data && data[0];
        }

        async function updateEssay(id, essayData) {
            const { error } = await cloudDb.from('essays').update(essayData).eq('id', id);
            if (error) throw error;
        }

        async function deleteEssay(id) {
            const { error } = await cloudDb.from('essays').delete().eq('id', id);
            if (error) throw error;
        }

        // ---------- UI ----------
        function updateUI() {
            const infoEl = document.getElementById('userInfo');
            const roleBadge = document.getElementById('roleBadge');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const changePwdBtn = document.getElementById('changePwdBtn');
            const exportAllBtn = document.getElementById('exportAllBtn');
            const loginName = document.getElementById('loginName');
            const loginPassword = document.getElementById('loginPassword');

            if (currentUser) {
                const roleLabel = currentUser.role === 'teacher' ? '👩‍🏫 老师' : '🧑‍🎓 学生';
                infoEl.innerHTML = '<span>👤 ' + currentUser.name + '</span>';
                roleBadge.textContent = roleLabel;
                loginBtn.style.display = 'none';
                logoutBtn.style.display = 'inline-block';
                changePwdBtn.style.display = 'inline-block';
                exportAllBtn.style.display = currentUser.role === 'teacher' ? 'inline-block' : 'none';
                loginName.style.display = 'none';
                loginPassword.style.display = 'none';
                document.getElementById('essayAuthor').value = currentUser.name;
                document.getElementById('essayAuthor').readOnly = true;
            } else {
                infoEl.innerHTML = '<span>👤 未登录</span>';
                roleBadge.textContent = '访客';
                loginBtn.style.display = 'inline-block';
                logoutBtn.style.display = 'none';
                changePwdBtn.style.display = 'none';
                exportAllBtn.style.display = 'none';
                loginName.style.display = 'inline-block';
                loginPassword.style.display = 'inline-block';
                document.getElementById('essayAuthor').value = '';
                document.getElementById('essayAuthor').readOnly = false;
            }
            renderList();
        }

        function canEdit(essay) {
            if (!currentUser) return false;
            if (currentUser.role === 'teacher') return true;
            return essay.owner === currentUser.name;
        }

        function canExport(essay) {
            if (!currentUser) return false;
            if (currentUser.role === 'teacher') return true;
            return essay.owner === currentUser.name;
        }
        // ---------- 导出 Word ----------
        function exportEssayToWord(essay) {
            if (!canExport(essay)) {
                alert('⚠️ 你只能导出自己上传的作文哦！');
                return;
            }
            const currentVer = getCurrentVersion(essay);
            const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
                '<head><meta charset="utf-8"><title>' + essay.title + '</title></head>' +
                '<body style="font-family:\'华文楷体\',KaiTi,serif; font-size:14pt; line-height:1.8; padding:40px;">' +
                '<h1 style="text-align:center; font-size:22pt; margin-bottom:10px;">' + essay.title + '</h1>' +
                '<p style="text-align:center; color:#666; margin-bottom:30px;">作者：' + essay.author + '　|　分类：' + essay.category + '　|　版本：' + (currentVer.versionName || '初稿') + '</p>' +
                '<hr style="border:none; border-top:1px dashed #ccc; margin:20px 0;">' +
                '<div style="white-space:pre-wrap;">' + currentVer.content.replace(/\n/g, '<br>') + '</div>' +
                '</body></html>';
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = essay.title + '_' + essay.author + '.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function exportAllToWord() {
            if (!currentUser || currentUser.role !== 'teacher') {
                alert('只有老师可以导出全部作文！');
                return;
            }
            if (essays.length === 0) {
                alert('暂无作文可导出');
                return;
            }
            let bodyHtml = '';
            essays.forEach(function(essay, idx) {
                const currentVer = getCurrentVersion(essay);
                bodyHtml += '<h2 style="text-align:center; font-size:18pt; margin-top:40px;">' + (idx + 1) + '. ' + essay.title + '</h2>' +
                    '<p style="text-align:center; color:#666; margin-bottom:20px;">作者：' + essay.author + '　|　分类：' + essay.category + '　|　版本：' + (currentVer.versionName || '初稿') + '</p>' +
                    '<div style="white-space:pre-wrap; margin-bottom:40px;">' + currentVer.content.replace(/\n/g, '<br>') + '</div>' +
                    '<hr style="border:none; border-top:1px dashed #ccc; margin:30px 0;">';
            });
            const html = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">' +
                '<head><meta charset="utf-8"><title>岁月留痕·九（12）作文集</title></head>' +
                '<body style="font-family:\'华文楷体\',KaiTi,serif; font-size:14pt; line-height:1.8; padding:40px;">' +
                '<h1 style="text-align:center; font-size:24pt; margin-bottom:10px;">岁月留痕 · 九（12）作文集</h1>' +
                '<p style="text-align:center; color:#666; margin-bottom:10px;">共 ' + essays.length + ' 篇</p>' +
                '<p style="text-align:center; color:#666; margin-bottom:40px;">导出时间：' + new Date().toLocaleString('zh-CN') + '</p>' +
                bodyHtml + '</body></html>';
            const blob = new Blob(['\ufeff', html], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            const now = new Date();
            const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
            a.download = '岁月留痕_九12_作文集_' + dateStr + '.doc';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ---------- 渲染 ----------
        let currentCategory = '全部';
        let currentSearch = '';

        function getFilteredEssays() {
            let result = essays.slice();
            if (currentCategory !== '全部') {
                result = result.filter(function(e) { return e.category === currentCategory; });
            }
            if (currentSearch.trim() !== '') {
                const keyword = currentSearch.trim();
                result = result.filter(function(e) { return e.author.indexOf(keyword) >= 0 || e.title.indexOf(keyword) >= 0; });
            }
            return result;
        }

        function getCurrentVersion(essay) {
            return essay.versions.find(function(v) { return v.vid === essay.currentVersion; }) || essay.versions[0] || { content: '' };
        }

        function sortVersionsByDate(versions) {
            return versions.slice().sort(function(a, b) { return a.timestamp - b.timestamp; });
        }

        function renderList() {
            const container = document.getElementById('essayListContainer');
            const filtered = getFilteredEssays();

            if (filtered.length === 0) {
                container.innerHTML = '<div class="empty-msg">📜 暂无文章，快来上传吧</div>';
                return;
            }

            let html = '';
            filtered.forEach(function(essay) {
                const currentVer = getCurrentVersion(essay);
                const verCount = essay.versions.length;
                const isOwner = canEdit(essay);
                const canExportThis = canExport(essay);
                html += '<div class="essay-item" data-id="' + essay.id + '">' +
                    '<div class="info">' +
                    '<span class="title">📜 ' + essay.title + ' <span class="version-badge">v' + verCount + '</span></span>' +
                    '<span class="author">✍️ ' + essay.author + '</span>' +
                    '<span class="category-tag">' + essay.category + '</span>' +
                    '<span class="version-info">📌 当前: ' + (currentVer.versionName || '初稿') + '</span>' +
                    '<span class="owner-tag">' + (essay.owner || essay.author) + '</span>' +
                    '</div>' +
                    '<div class="action-btns">' +
                    '<button class="upgrade-btn" data-id="' + essay.id + '"' + (!isOwner ? ' disabled' : '') + '>🚀 升格</button>' +
                    '<button class="edit-btn" data-id="' + essay.id + '"' + (!isOwner ? ' disabled' : '') + '>✏️ 编辑</button>' +
                    (canExportThis ? '<button class="export-btn" data-id="' + essay.id + '">📥 导出</button>' : '') +
                    '<button class="delete-btn" data-id="' + essay.id + '"' + (!isOwner ? ' disabled' : '') + '>🗑️ 删除</button>' +
                    '</div></div>';
            });
            container.innerHTML = html;

            container.querySelectorAll('.essay-item').forEach(function(item) {
                const id = item.dataset.id;
                item.addEventListener('click', function(e) {
                    if (e.target.closest('.edit-btn') || e.target.closest('.delete-btn') || e.target.closest('.upgrade-btn') || e.target.closest('.export-btn')) return;
                    const essay = essays.find(function(e) { return e.id === id; });
                    if (essay) openReadModal(essay);
                });
            });

            container.querySelectorAll('.edit-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.disabled) return;
                    const id = this.dataset.id;
                    const essay = essays.find(function(e) { return e.id === id; });
                    if (essay) openEditModal(essay);
                });
            });

            container.querySelectorAll('.upgrade-btn').forEach(function(btn) {
                btn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    if (this.disabled) return;
                    const id = this.dataset.id;
                    const essay = essays.find(function(e) { return e.id === id; });
                    if (essay) {
                        const currentVer = getCurrentVersion(essay);
                        const newVid = 'v' + (essay.versions.length + 1);
                        const now = new Date();
                        const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                        const newVersion = { vid: newVid, content: currentVer.content, timestamp: Date.now(), versionName: dateStr + ' 升格稿' };
                        essay.versions.push(newVersion);
                        essay.currentVersion = newVid;
                        try {
                            await updateEssay(id, { versions: essay.versions, current_version: newVid });
                            await loadData();
                            openEditModal(essay);
                        } catch (err) {
                            alert('升格失败：' + err.message);
                        }
                    }
                });
            });

            container.querySelectorAll('.export-btn').forEach(function(btn) {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = this.dataset.id;
                    const essay = essays.find(function(e) { return e.id === id; });
                    if (essay) exportEssayToWord(essay);
                });
            });

            container.querySelectorAll('.delete-btn').forEach(function(btn) {
                btn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    if (this.disabled) return;
                    const id = this.dataset.id;
                    if (confirm('确定删除此篇及其所有版本？')) {
                        try {
                            await deleteEssay(id);
                            await loadData();
                        } catch (err) {
                            alert('删除失败：' + err.message);
                        }
                    }
                });
            });
        }

        // ---------- 模态框 ----------
        function openReadModal(essay) {
            currentEditId = essay.id;
            const container = document.getElementById('essayFullContent');
            const currentVer = getCurrentVersion(essay);
            const sortedVersions = sortVersionsByDate(essay.versions);
            let versionHtml = '';
            sortedVersions.forEach(function(v, idx) {
                const isCurrent = v.vid === essay.currentVersion;
                versionHtml += '<div class="version-item">' +
                    '<span class="v-badge">' + (v.versionName || '稿' + (idx + 1)) + '</span>' +
                    '<span class="v-preview">' + v.content.substring(0, 40) + (v.content.length > 40 ? '……' : '') + '</span>' +
                    (isCurrent ? '⭐ 当前' : '') +
                    '<button class="v-action" data-vid="' + v.vid + '">查看</button>' +
                    '<button class="v-action" data-vid="' + v.vid + '" data-setcurrent="1">设为当前</button>' +
                    '</div>';
            });

            const hasEditPermission = canEdit(essay);
            const hasExportPermission = canExport(essay);

            container.innerHTML = '<div class="read-title">' + essay.title + '</div>' +
                '<div class="read-meta">' +
                '<span>✍️ ' + essay.author + '</span>' +
                '<span>📂 ' + essay.category + '</span>' +
                '<span>📌 共 ' + essay.versions.length + ' 个版本</span>' +
                '<span style="color:#5f8599;">📎 上传者：' + (essay.owner || essay.author) + '</span>' +
                '</div>' +
                '<div class="read-content" id="readContentDisplay">' + currentVer.content + '</div>' +
                '<div class="version-history"><h3>📚 版本历史（按日期排序）</h3>' + versionHtml + '</div>' +
                '<div class="edit-actions">' +
                (hasExportPermission ? '<button class="btn btn-export" id="readExportBtn" style="background:#aac2d1;box-shadow:0 6px 0 #6f8fa3;">📥 导出Word</button>' : '') +
                (hasEditPermission ? '<button class="btn btn-upgrade" id="readUpgradeBtn">🚀 升格 (新建版本)</button>' : '') +
                (hasEditPermission ? '<button class="btn btn-save" id="readEditBtn">✏️ 编辑当前版本</button>' : '<span style="color:#5f8599;font-size:1rem;">🔒 仅上传者或老师可编辑</span>') +
                '</div>';
            document.getElementById('readingModal').classList.add('show');
            document.body.style.overflow = 'hidden';

            document.getElementById('readExportBtn') && document.getElementById('readExportBtn').addEventListener('click', function() { exportEssayToWord(essay); });

            container.querySelectorAll('.v-action[data-vid]').forEach(function(btn) {
                btn.addEventListener('click', async function(e) {
                    e.stopPropagation();
                    const vid = this.dataset.vid;
                    const ver = essay.versions.find(function(v) { return v.vid === vid; });
                    if (ver) {
                        document.getElementById('readContentDisplay').textContent = ver.content;
                        container.querySelectorAll('.version-item').forEach(function(el) { el.style.background = ''; });
                        this.closest('.version-item').style.background = '#d5e7f0';
                    }
                    if (this.dataset.setcurrent) {
                        essay.currentVersion = vid;
                        try {
                            await updateEssay(essay.id, { current_version: vid });
                            await loadData();
                            openReadModal(essay);
                        } catch (err) {
                            alert('设置失败：' + err.message);
                        }
                    }
                });
            });

            if (hasEditPermission) {
                document.getElementById('readUpgradeBtn') && document.getElementById('readUpgradeBtn').addEventListener('click', async function() {
                    const currentVer = getCurrentVersion(essay);
                    const newVid = 'v' + (essay.versions.length + 1);
                    const now = new Date();
                    const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                    const newVersion = { vid: newVid, content: currentVer.content, timestamp: Date.now(), versionName: dateStr + ' 升格稿' };
                    essay.versions.push(newVersion);
                    essay.currentVersion = newVid;
                    try {
                        await updateEssay(essay.id, { versions: essay.versions, current_version: newVid });
                        await loadData();
                        openEditModal(essay);
                    } catch (err) {
                        alert('升格失败：' + err.message);
                    }
                });

                document.getElementById('readEditBtn') && document.getElementById('readEditBtn').addEventListener('click', function() { openEditModal(essay); });
            }
        }
        function openEditModal(essay) {
            if (!canEdit(essay)) {
                alert('你没有权限编辑此作文！');
                return;
            }
            currentEditId = essay.id;
            const currentVer = getCurrentVersion(essay);
            const container = document.getElementById('essayFullContent');
            container.innerHTML = '<input class="edit-title" id="editTitle" value="' + essay.title + '" placeholder="标题" />' +
                '<div class="meta-edit">' +
                '<label>作者：<input id="editAuthor" value="' + essay.author + '" placeholder="作者" /></label>' +
                '<label>分类：<select id="editCategory">' +
                '<option value="记叙文"' + (essay.category === '记叙文' ? ' selected' : '') + '>📝 记叙文</option>' +
                '<option value="议论文"' + (essay.category === '议论文' ? ' selected' : '') + '>💬 议论文</option>' +
                '<option value="散文"' + (essay.category === '散文' ? ' selected' : '') + '>🌸 散文</option>' +
                '</select></label>' +
                '<span style="margin-left:auto;color:#2d5e73;">当前版本：' + currentVer.versionName + '</span>' +
                '</div>' +
                '<textarea class="edit-content" id="editContent">' + currentVer.content + '</textarea>' +
                '<div class="edit-actions">' +
                '<button class="btn btn-save" id="saveEditBtn">💾 保存此版本</button>' +
                '<button class="btn btn-upgrade" id="upgradeFromEditBtn">🚀 升格为新版本</button>' +
                '<button class="btn btn-cancel" id="cancelEditBtn">✖ 取消</button>' +
                '</div>';
            document.getElementById('readingModal').classList.add('show');
            document.body.style.overflow = 'hidden';

            document.getElementById('saveEditBtn').addEventListener('click', async function() {
                const newTitle = document.getElementById('editTitle').value.trim();
                const newAuthor = document.getElementById('editAuthor').value.trim();
                const newCategory = document.getElementById('editCategory').value;
                const newContent = document.getElementById('editContent').value;

                if (!newTitle || !newAuthor || !newContent) {
                    alert('📢 标题、作者与内容都不能为空哦！');
                    return;
                }

                const target = essays.find(function(e) { return e.id === currentEditId; });
                if (target) {
                    const currentVer = getCurrentVersion(target);
                    currentVer.content = newContent;
                    currentVer.timestamp = Date.now();
                    try {
                        await updateEssay(target.id, { title: newTitle, author: newAuthor, category: newCategory, versions: target.versions });
                        await loadData();
                        const updated = essays.find(function(e) { return e.id === currentEditId; });
                        if (updated) openReadModal(updated);
                    } catch (err) {
                        alert('保存失败：' + err.message);
                    }
                }
            });

            document.getElementById('upgradeFromEditBtn').addEventListener('click', async function() {
                const newTitle = document.getElementById('editTitle').value.trim();
                const newAuthor = document.getElementById('editAuthor').value.trim();
                const newCategory = document.getElementById('editCategory').value;
                const newContent = document.getElementById('editContent').value;

                if (!newTitle || !newAuthor || !newContent) {
                    alert('📢 标题、作者与内容都不能为空哦！');
                    return;
                }

                const target = essays.find(function(e) { return e.id === currentEditId; });
                if (target) {
                    const newVid = 'v' + (target.versions.length + 1);
                    const now = new Date();
                    const dateStr = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');
                    const newVersion = { vid: newVid, content: newContent, timestamp: Date.now(), versionName: dateStr + ' 升格稿' };
                    target.versions.push(newVersion);
                    target.currentVersion = newVid;
                    try {
                        await updateEssay(target.id, { title: newTitle, author: newAuthor, category: newCategory, versions: target.versions, current_version: newVid });
                        await loadData();
                        const updated = essays.find(function(e) { return e.id === currentEditId; });
                        if (updated) openReadModal(updated);
                    } catch (err) {
                        alert('升格失败：' + err.message);
                    }
                }
            });

            document.getElementById('cancelEditBtn').addEventListener('click', function() {
                const target = essays.find(function(e) { return e.id === currentEditId; });
                if (target) {
                    openReadModal(target);
                } else {
                    closeModal();
                }
            });
        }

        function closeModal() {
            document.getElementById('readingModal').classList.remove('show');
            document.body.style.overflow = '';
            currentEditId = null;
        }

        // ---------- 上传 ----------
        async function uploadEssay() {
            if (!currentUser) {
                alert('请先登录再上传作文！');
                return;
            }

            const title = document.getElementById('essayTitle').value.trim();
            const author = document.getElementById('essayAuthor').value.trim();
            const category = document.getElementById('essayCategory').value;
            const content = document.getElementById('essayContent').value.trim();

            if (!title || !author || !content) {
                alert('📢 标题、作者与内容都不能为空哦！');
                return;
            }

            if (currentUser.role === 'student' && author !== currentUser.name) {
                alert('⚠️ 作为学生，你只能上传自己写的作文（作者名需与登录名一致）！');
                return;
            }

            const initialVersion = { vid: 'v1', content: content, timestamp: Date.now(), versionName: '初稿' };

            try {
                await insertEssay({
                    title: title,
                    author: author,
                    category: category,
                    content: content,
                    owner: currentUser.name,
                    versions: [initialVersion],
                    current_version: 'v1'
                });

                document.getElementById('essayTitle').value = '';
                document.getElementById('essayContent').value = '';
                document.getElementById('essayFileInput').value = '';
                document.getElementById('fileNameDisplay').textContent = '未选择文件（支持 .txt / .docx / .pdf / .doc）';

                currentCategory = '全部';
                document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
                document.querySelector('.cat-btn[data-cat="全部"]') && document.querySelector('.cat-btn[data-cat="全部"]').classList.add('active');
                document.getElementById('searchInput').value = '';
                currentSearch = '';

                await loadData();
                alert('✅ 作文《' + title + '》上传成功！');
            } catch (err) {
                alert('❌ 上传失败：' + err.message);
            }
        }

        async function resetData() {
            if (!currentUser || currentUser.role !== 'teacher') {
                alert('只有老师可以重置数据！');
                return;
            }
            if (confirm('重置将删除所有云端作文，确定吗？')) {
                try {
                    for (let i = 0; i < essays.length; i++) {
                        await deleteEssay(essays[i].id);
                    }
                    await loadData();
                    alert('✅ 已清空所有作文');
                } catch (err) {
                    alert('重置失败：' + err.message);
                }
            }
        }

        // ---------- 密码修改弹窗 ----------
        function showPwdModal() {
            document.getElementById('pwdModal').classList.add('show');
            document.getElementById('oldPwd').value = '';
            document.getElementById('newPwd').value = '';
            document.getElementById('confirmPwd').value = '';
            document.getElementById('pwdMsg').textContent = '';
        }

        function closePwdModal() {
            document.getElementById('pwdModal').classList.remove('show');
        }

        function handlePwdChange() {
            const oldPwd = document.getElementById('oldPwd').value;
            const newPwd = document.getElementById('newPwd').value;
            const confirmPwd = document.getElementById('confirmPwd').value;

            if (!currentUser) {
                alert('请先登录');
                return;
            }

            if (newPwd !== confirmPwd) {
                document.getElementById('pwdMsg').textContent = '❌ 两次输入的新密码不一致';
                return;
            }

            const users = loadUsers();
            const result = changePassword(users, currentUser.name, oldPwd, newPwd);
            document.getElementById('pwdMsg').textContent = result.success ? '✅ ' + result.msg : '❌ ' + result.msg;
            if (result.success) {
                setTimeout(closePwdModal, 1500);
            }
        }

        // ---------- 本地文件读取 ----------
        async function readDocxFile(file) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            return result.value;
        }

        async function readPdfFile(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = '';
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(function(item) { return item.str; }).join('');
                fullText += pageText + '\n';
            }
            return fullText;
        }

        async function readDocFile(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                if (result.value && result.value.trim().length > 0) {
                    return result.value;
                }
            } catch (e) {}
            try {
                const text = await file.text();
                const cleanText = text.replace(/[^\u4e00-\u9fa5a-zA-Z0-9\s，。！？、；：""''（）《》…—\-.,!?;:()\[\]{}]/g, '');
                if (cleanText.trim().length > 10) {
                    return cleanText;
                }
            } catch (e) {}
            throw new Error('无法解析此 .doc 文件，建议另存为 .docx 后重试');
        }

        function readTxtFile(file) {
            return new Promise(function(resolve, reject) {
                const reader = new FileReader();
                reader.onload = function(e) { resolve(e.target.result); };
                reader.onerror = function() { reject(new Error('文件读取失败')); };
                reader.readAsText(file, 'UTF-8');
            });
        }

        // ---------- 初始化 ----------
        async function init() {
            await initCloud();

            const savedUser = localStorage.getItem(STORAGE_CURRENT_USER);
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                } catch (e) {
                    currentUser = null;
                }
            }

            document.getElementById('loginBtn').addEventListener('click', function() {
                const name = document.getElementById('loginName').value.trim();
                const password = document.getElementById('loginPassword').value;

                const checkResult = loginUser(name, password);

                if (checkResult.needInvite) {
                    const inviteCode = prompt('👩‍🏫 老师首次登录，请输入邀请码：');
                    if (inviteCode === null) return;
                    if (inviteCode !== TEACHER_INVITE_CODE) {
                        alert('❌ 邀请码错误，无法注册老师账号');
                        return;
                    }
                    if (password.length < 6) {
                        alert('❌ 密码至少6位');
                        return;
                    }
                    const result = completeTeacherRegister(password, inviteCode);
                    if (result.success) {
                        alert('✅ 老师账号注册成功！欢迎 筠老师');
                        document.getElementById('loginPassword').value = '';
                    } else {
                        alert('❌ ' + result.msg);
                    }
                    return;
                }

                if (!checkResult.success) {
                    alert(checkResult.msg);
                } else {
                    document.getElementById('loginPassword').value = '';
                }
            });

            document.getElementById('loginPassword').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });
            document.getElementById('loginName').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') document.getElementById('loginBtn').click();
            });

            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('changePwdBtn').addEventListener('click', showPwdModal);
            document.getElementById('exportAllBtn').addEventListener('click', exportAllToWord);

            document.getElementById('pwdSaveBtn').addEventListener('click', handlePwdChange);
            document.getElementById('pwdCancelBtn').addEventListener('click', closePwdModal);
            document.getElementById('pwdModal').addEventListener('click', function(e) {
                if (e.target === this) closePwdModal();
            });
            document.getElementById('newPwd').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') handlePwdChange();
            });
            document.getElementById('confirmPwd').addEventListener('keyup', function(e) {
                if (e.key === 'Enter') handlePwdChange();
            });

            document.querySelectorAll('.cat-btn').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.cat-btn').forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    currentCategory = this.dataset.cat;
                    renderList();
                });
            });

            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');

            function performSearch() {
                currentSearch = searchInput.value;
                renderList();
            }
            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keyup', function(e) {
                if (e.key === 'Enter') performSearch();
            });

            document.getElementById('uploadBtn').addEventListener('click', uploadEssay);
            document.getElementById('resetDataBtn').addEventListener('click', resetData);

            const chooseFileBtn = document.getElementById('chooseFileBtn');
            const essayFileInput = document.getElementById('essayFileInput');
            const fileNameDisplay = document.getElementById('fileNameDisplay');

            chooseFileBtn.addEventListener('click', function() {
                essayFileInput.click();
            });

            essayFileInput.addEventListener('change', async function() {
                const file = this.files[0];
                if (!file) {
                    fileNameDisplay.textContent = '未选择文件（支持 .txt / .docx / .pdf / .doc）';
                    return;
                }

                const ext = file.name.split('.').pop().toLowerCase();
                const supportedExts = ['txt', 'docx', 'pdf', 'doc'];

                if (supportedExts.indexOf(ext) < 0) {
                    alert('⚠️ 不支持的文件类型！请选择 .txt / .docx / .pdf / .doc 文件。');
                    essayFileInput.value = '';
                    fileNameDisplay.textContent = '未选择文件（支持 .txt / .docx / .pdf / .doc）';
                    return;
                }

                if (file.size > 10 * 1024 * 1024) {
                    alert('⚠️ 文件太大了（超过10MB），请检查是否选错文件。');
                    essayFileInput.value = '';
                    fileNameDisplay.textContent = '未选择文件（支持 .txt / .docx / .pdf / .doc）';
                    return;
                }

                fileNameDisplay.textContent = '⏳ 正在读取：' + file.name;

                try {
                    let content = '';
                    if (ext === 'txt') {
                        content = await readTxtFile(file);
                    } else if (ext === 'docx') {
                        content = await readDocxFile(file);
                    } else if (ext === 'pdf') {
                        content = await readPdfFile(file);
                    } else if (ext === 'doc') {
                        content = await readDocFile(file);
                    }

                    if (!content || content.trim().length === 0) {
                        alert('⚠️ 文件内容为空，或无法提取文字。');
                        fileNameDisplay.textContent = '未选择文件（支持 .txt / .docx / .pdf / .doc）';
                        essayFileInput.value = '';
                        return;
                    }

                    document.getElementById('essayContent').value = content.trim();
                    fileNameDisplay.textContent = '✅ 已读取：' + file.name + '（' + content.length + ' 字）';
                } catch (err) {
                    alert('❌ 文件解析失败：' + err.message);
                    fileNameDisplay.textContent = '未选择文件（支持 .txt / .docx / .pdf / .doc）';
                    essayFileInput.value = '';
                }
            });

            document.getElementById('closeModalBtn').addEventListener('click', closeModal);
            document.getElementById('readingModal').addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });

            updateUI();
            loadData();
        }

        init();
    })();
    </script>
</body>
